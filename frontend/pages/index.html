<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket System - Login</title>
    <link rel="icon" type="image/jpeg" href="/assets/images/logo.jpg" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
    <style>
      .login-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .login-card {
        width: 100%;
        max-width: 400px;
        padding: 2rem;
      }

      .login-header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .login-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 1rem;
        border-radius: 50%;
        background: var(--primary-color);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        margin-left: auto;
        margin-right: auto;
      }

      .login-header h1 {
        font-size: 1.75rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .login-header p {
        color: var(--text-muted);
        font-size: 0.875rem;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      .form-label {
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: var(--text-color);
      }

      .btn-login {
        width: 100%;
        padding: 0.75rem;
        font-weight: 600;
        font-size: 1rem;
      }

      .error-message {
        display: none;
        margin-bottom: 1rem;
      }

      .loading {
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <div class="card login-card">
        <div class="login-header">
          <div class="login-logo">🎫</div>
          <h1>Ticket System</h1>
          <p>Event Ticket Management Platform</p>
        </div>

        <form id="loginForm">
          <div class="error-message" id="errorMessage" role="alert"></div>

          <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="admin@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Mot de passe</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Entrez votre mot de passe"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary btn-login">
            <span class="loading">
              <span class="spinner-border spinner-border-sm me-2"></span>Connexion...
            </span>
            <span class="normal">Se connecter</span>
          </button>
        </form>

        <div class="mt-3 text-center">
          <p class="text-muted" style="font-size: 0.875rem">
            Démo: admin@example.com / AdminPass123
          </p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/services/auth-service.js"></script>
    <script src="js/utils/notifications.js"></script>
    <script src="js/utils/storage.js"></script>
    <script src="js/main.js"></script>

    <script>
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('errorMessage');
        const loadingSpan = document.querySelector('.loading');
        const normalSpan = document.querySelector('.normal');
        const submitBtn = document.querySelector('button[type="submit"]');

        // Show loading
        loadingSpan.style.display = 'inline';
        normalSpan.style.display = 'none';
        submitBtn.disabled = true;
        errorDiv.style.display = 'none';

        try {
          const result = await window.authService.login(email, password);

          if (result.success) {
            NotificationManager.success('Connexion réussie!');
            // Redirect based on role
            const user = window.authService.getCurrentUser();
            const redirectUrl =
              user.role === 'admin' ? '/admin.html' : '/manager.html';
            setTimeout(() => {
              window.location.href = redirectUrl;
            }, 500);
          } else {
            errorDiv.textContent = result.message || 'Connexion échouée';
            errorDiv.className = 'alert alert-danger error-message';
            errorDiv.style.display = 'block';
            NotificationManager.error(result.message);
          }
        } catch (error) {
          console.error('Login error:', error);
          errorDiv.textContent = 'Une erreur est survenue';
          errorDiv.className = 'alert alert-danger error-message';
          errorDiv.style.display = 'block';
          NotificationManager.error('Erreur de connexion');
        } finally {
          // Hide loading
          loadingSpan.style.display = 'none';
          normalSpan.style.display = 'inline';
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>

services:
  - type: web
    name: ticket-system
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Configure these in Render Dashboard:
      # - DB_URI: Your MongoDB Atlas connection string
      # - JWT_SECRET: Random 32+ character string
      # - BASE_URL: Your Render app URL

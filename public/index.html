<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TicketSystem | Validation de billet</title>
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <style>
      :root {
        --primary-color: #6f42c1;
        --secondary-color: #f8f9fa;
      }

      body {
        background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
          url("/background.png") no-repeat center center fixed;
        background-size: cover;
        color: white;
        min-height: 100vh;
      }

      .validation-card {
        background-color: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        max-width: 600px;
        margin: 0 auto;
      }

      .btn-validate {
        background-color: var(--primary-color);
        border: none;
        transition: all 0.3s;
      }

      .btn-validate:hover {
        background-color: #5a32a8;
        transform: translateY(-2px);
      }

      .result-container {
        min-height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .admin-link {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
      }

      .qr-btn {
        border-left: none !important;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <header class="text-center mb-5">
        <img
          src="/logo.jpg"
          alt="Logo YachtParty"
          class="img-fluid rounded-circle shadow-lg border border-1 border-white"
          style="max-height: 140px; background: black; padding: 0px"
        />
        <h1 class="mt-3">🎟️ A.E.E.M.T. CONCERT LIL-DOU 🎟️</h1>
        <p class="lead"><b>Validation de tickets</b></p>
      </header>

      <div class="validation-card p-4 shadow-lg">
        <div class="row justify-content-center">
          <div class="col-md-8">
            <div class="mb-3">
              <label for="codeInput" class="form-label"
                ><b>Entrez le code du ticket</b></label
              >
              <div class="input-group">
                <input
                  type="text"
                  id="codeInput"
                  class="form-control form-control-lg"
                  placeholder="Code à 6 caractères"
                  required
                />
                <button
                  class="btn btn-outline-secondary qr-btn"
                  type="button"
                  onclick="openQRScanner()"
                >
                  <i class="bi bi-qr-code-scan"></i>
                </button>
                <button
                  class="btn btn-validate"
                  type="button"
                  onclick="valider()"
                >
                  <i class="bi bi-check-circle"></i> Valider
                </button>
              </div>
              <div class="form-text text-white-50 mt-1">
                <b>Entrez le code imprimé ou scannez le QR code</b>
              </div>
            </div>

            <div id="result" class="result-container mt-4">
              <!-- Résultat apparaîtra ici -->
            </div>
          </div>
        </div>
      </div>

      <!-- Bouton Admin (en bas à droite) -->
      <a
        href="/admin.html"
        class="btn btn-outline-danger admin-link rounded-circle shadow"
        title="Espace Admin"
      >
        <i class="bi bi-lock-fill" style="font-size: 1.5rem"></i>
      </a>
    </div>

    <!-- Scanner QR Code Modal -->
    <div class="modal fade" id="qrModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content bg-dark">
          <div class="modal-header">
            <h5 class="modal-title">Scanner un ticket</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body text-center">
            <div id="qrReader" style="width: 100%"></div>
            <div id="qrResult" class="mt-3"></div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Fermer
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
      // Fonction de validation améliorée
      async function valider() {
        const code = document.getElementById("codeInput").value.trim();
        const resultDiv = document.getElementById("result");

        // Validation basique
        if (!code || code.length !== 6) {
          resultDiv.innerHTML = `
            <div class="alert alert-warning w-100">
                <i class="bi bi-exclamation-triangle"></i> Le code doit contenir exactement 6 caractères
            </div>`;
          return;
        }

        // Afficher le loader
        resultDiv.innerHTML = `
        <div class="text-center">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Validation en cours...</span>
            </div>
            <p>Validation en cours...</p>
        </div>`;

        try {
          const token = localStorage.getItem("token");
          if (!token) {
            throw new Error("Vous devez être connecté pour valider un billet");
          }

          const response = await fetch(
            `/validate?code=${encodeURIComponent(code)}`,
            {
              headers: {
                Authorization: `Bearer ${token}`,
              },
            }
          );

          if (response.status === 401) {
            throw new Error(
              "Session expirée ou invalide. Veuillez vous reconnecter."
            );
          }

          if (response.status === 403) {
            throw new Error(
              "Accès refusé: vous n'avez pas les droits nécessaires."
            );
          }

          if (!response.ok) {
            const errorData = await response.json();
            throw new Error(
              errorData.message || "Code invalide. Veuillez réessayer."
            );
          }

          const data = await response.json();

          const date = new Date(data.usedAt || new Date()).toLocaleString();
          
          // Déterminer si c'est un ticket déjà utilisé
          const isAlreadyUsed = data.message && data.message.includes("déjà utilisé");
          const alertClass = isAlreadyUsed ? "alert-danger" : "alert-success";
          
          resultDiv.innerHTML = `
            <div class="alert ${alertClass} w-100">
                <h4> ${
                  data.message || "Billet validé!"
                }</h4>
                <hr>
                <p><b>Code: </b><strong>${code}</strong></p>
                <p><b>Validé le: </b><strong>${date}</strong></p>
            </div>`;

          // Effacer le champ après validation
          document.getElementById("codeInput").value = "";
          
          // Auto-effacer le résultat après 5 secondes
          setTimeout(() => {
            resultDiv.innerHTML = "";
          }, 5000);
        } catch (error) {
          console.error("Erreur:", error);
          resultDiv.innerHTML = `
            <div class="alert alert-danger w-100">
                ${error.message || "Erreur lors de la validation"}
            </div>`;
          
          // Auto-effacer les erreurs après 5 secondes
          setTimeout(() => {
            resultDiv.innerHTML = "";
          }, 5000);
        }
      }

      // Normalise le texte scanné : si c'est une URL avec ?code=XXX, on extrait uniquement le code
      function extractCodeFromScan(text) {
        try {
          const maybeUrl = new URL(text);
          const codeParam = maybeUrl.searchParams.get("code");
          if (codeParam) {
            return codeParam;
          }
        } catch (e) {
          // Pas une URL, on garde le texte brut
        }
        return text;
      }

      // Activer la validation avec la touche Entrée
      document
        .getElementById("codeInput")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            valider();
          }
        });

      // Initialiser le scanner QR quand le modal s'ouvre
      const qrModal = new bootstrap.Modal(document.getElementById("qrModal"));
      let html5QrCode;

      document
        .getElementById("qrModal")
        .addEventListener("shown.bs.modal", function () {
          // Effacer le résultat précédent quand on ouvre le scanner
          document.getElementById("result").innerHTML = "";
          document.getElementById("codeInput").value = "";
          
          html5QrCode = new Html5Qrcode("qrReader");
          const qrResult = document.getElementById("qrResult");
          
          // Effacer l'ancien message du scanner
          qrResult.innerHTML = "";

          html5QrCode
            .start(
              { facingMode: "environment" },
              {
                fps: 10,
                qrbox: 250,
              },
              (decodedText) => {
                // Arrêter le scanner quand un code est détecté
                html5QrCode.stop().then(() => {
                  qrResult.innerHTML = `
                            <div class="alert alert-info">
                                <i class="bi bi-check-circle"></i> Code détecté: ${decodedText}
                            </div>
                        `;

                  // Remplir le champ avec le code extrait (URL ou code brut) et valider automatiquement
                  const normalizedCode = extractCodeFromScan(decodedText);
                  document.getElementById("codeInput").value = normalizedCode;
                  setTimeout(() => {
                    valider();
                    qrModal.hide();
                  }, 1000);
                });
              },
              (errorMessage) => {
                // Ignorer les erreurs de parsing
              }
            )
            .catch((err) => {
              qrResult.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle"></i> Erreur: ${err}
                    </div>
                `;
            });
        });

      // Arrêter le scanner quand le modal se ferme
      document
        .getElementById("qrModal")
        .addEventListener("hidden.bs.modal", function () {
          if (html5QrCode) {
            html5QrCode
              .stop()
              .catch((err) => console.log("Arrêt du scanner:", err));
          }
          document.getElementById("qrResult").innerHTML = "";
        });

      // Fonction pour ouvrir le scanner QR
      function openQRScanner() {
        // Effacer les anciens résultats avant d'ouvrir
        document.getElementById("result").innerHTML = "";
        document.getElementById("codeInput").value = "";
        qrModal.show();
      }
    </script>
  </body>
</html>

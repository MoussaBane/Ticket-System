<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Validation de billet</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
    </head>
    <body class="bg-light">
        <div class="container mt-5 text-center">
            <h1>🎟️ Validation de Billet</h1>
            <input type="text" id="codeInput" class="form-control mt-4"
                placeholder="Entrez votre code..." />
            <button class="btn btn-primary mt-3"
                onclick="valider()">Valider</button>
            <div id="result" class="mt-4 fw-bold"></div>
        </div>

        <script>
            async function valider() {
            const code = document.getElementById('codeInput').value;
            const res = await fetch(`/validate?code=${code}`);
            const text = await res.text();
            document.getElementById('result').innerText = text;
            }
        </script>
    </body>
</html>

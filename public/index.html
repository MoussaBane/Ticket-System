<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>AfroVibe Night Validation de billet</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

        <style>
            /* body {
                background: linear-gradient(to right, #ff7e5f, #feb47b); 
                color: white;
                font-family: 'Arial', sans-serif;
            } */

            header {
                text-align: center;
                padding: 20px;
            }

            .container {
                margin-top: 50px;
                text-align: center;
            }

            body {
                background-image: url("/background.jpg");
                background-size: cover;
                background-position: center center;
                color: white;
            }

        </style>
    </head>
    <body class="bg-light">

        <header class="text-center my-4">
            <img src="/logo.png" alt="Logo" width="150">
        </header>
          
        <div class="container mt-5 text-center">
            <h1 class="text-center mb-4">🎟️ AEEMT AfroVibe Night Validation de Billet 🎟️</h1>
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <input type="text" id="codeInput" class="form-control" placeholder="Entrez votre code" required>
                    <button class="btn btn-info mt-2 w-100" onclick="valider()">Valider</button>
                </div>
            <div id="result" class="mt-4 fw-bold"></div>
        </div>

        <script>
            async function valider() {
            const code = document.getElementById('codeInput').value;
            const res = await fetch(`/validate?code=${code}`);
            const text = await res.text();
            document.getElementById('result').innerText = text;
            }
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    </body>
</html>

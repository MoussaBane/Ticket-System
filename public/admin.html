<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Panneau d'administration pour la gestion des tickets de l'AfroVibe Night.">
        <meta name="author" content="Moussa BANE">
        <title>Panneau d'Admin</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
            rel="stylesheet">
    </head>
    <body>

        <div class="d-flex justify-content-between align-items-center my-4">
            <h5 id="totalCount" class="mb-0 text-primary"></h5>
            <h5 id="usedCount" class="mb-0 text-success"></h5>
            <h5 id="unusedCount" class="mb-0 text-danger"></h5>
        </div>
          

        <div class="mb-4">
            <input type="text" class="form-control" id="searchInput" placeholder="Rechercher un ticket par code...">
        </div>
          
        <div class="container mt-5">
            <h2 class="text-center mb-4">Tickets Gérés</h2>
            
            <a href="/admin/export-csv" class="btn btn-outline-primary mb-3" download>
                📤 Exporter en CSV
            </a>
              
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Code</th>
                        <th scope="col">Statut</th>
                        <th scope="col">Date de Création</th>
                    </tr>
                </thead>
                <tbody id="ticket-list">
                    <!-- Les tickets seront injectés ici -->
                </tbody>
            </table>
        </div>

        <script>
            if (localStorage.getItem('isAdmin') !== 'true') {
              window.location.href = '/admin-login.html';
            }
        </script>
          
        <script>
            fetch('/admin/tickets')
            .then(response => response.json())
            .then(tickets => {
                const ticketList = document.getElementById('ticket-list');
                tickets.forEach(ticket => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${ticket._id}</td>
                        <td>${ticket.code}</td>
                        <td id="status-${ticket._id}">${ticket.isUsed ? '✅ Utilisé' : '⏳ Non utilisé'}</td>
                        <td>${new Date(ticket.createdAt).toLocaleString()}</td>
                        <td>
                            <button class="btn btn-sm btn-success" ${ticket.isUsed ? 'disabled' : ''} onclick="useTicket('${ticket._id}')">Marquer comme utilisé</button>
                        </td>`
                    ;
                    ticketList.appendChild(row);
                });
            });

            let ticketsData = [];

            fetch('/admin/tickets')
                .then(response => response.json())
                .then(tickets => {
                ticketsData = tickets;
                renderTable(tickets);
            });

            function renderTable(tickets) {
                const ticketList = document.getElementById('ticket-list');
                ticketList.innerHTML = '';

                let used = 0;
                let unused = 0;

                tickets.forEach(ticket => {
                    if (ticket.isUsed) used++;
                    else unused++;

                    const row = document.createElement('tr');
                    row.innerHTML = `
                    <td>${ticket._id}</td>
                    <td>${ticket.code}</td>
                    <td id="status-${ticket._id}">${ticket.isUsed ? '✅ Utilisé' : '⏳ Non utilisé'}</td>
                    <td>${new Date(ticket.createdAt).toLocaleString()}</td>
                    <td>
                        <button class="btn btn-sm btn-success" ${ticket.isUsed ? 'disabled' : ''} onclick="useTicket('${ticket._id}')">Marquer comme utilisé</button>
                    </td>
                    `;
                    ticketList.appendChild(row);
                });

                // Afficher les compteurs
                document.getElementById('totalCount').textContent = `🎟️ Total : ${tickets.length}`;
                document.getElementById('usedCount').textContent = `✅ Utilisés : ${used}`;
                document.getElementById('unusedCount').textContent = `⏳ Non utilisés : ${unused}`;
            }


            document.getElementById('searchInput').addEventListener('input', function () {
                const keyword = this.value.toLowerCase();
                const filtered = ticketsData.filter(ticket => ticket.code.toLowerCase().includes(keyword));
                renderTable(filtered);
            });

            function useTicket(id) {
                fetch(`/admin/tickets/${id}/use`, { method: 'POST' })
                .then(response => response.json())
                .then(ticket => {
                    document.getElementById(`status-${ticket._id}`).textContent = '✅ Utilisé';
                    alert(`Le ticket ${ticket.code} est maintenant marqué comme utilisé.`);
                    location.reload(); 
                });
            }
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panneau Admin - AfroVibe</title>
    <meta
      name="description"
      content="Interface de gestion des tickets pour AfroVibe Night."
    />
    <meta name="author" content="Moussa BANE" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>🎫 Panneau d’administration</h2>
        <button class="btn btn-outline-danger" onclick="logout()">
          Déconnexion
        </button>
      </div>

      <!-- Statistiques -->
      <div class="row text-center mb-4">
        <div class="col-md-4">
          <div class="card shadow-sm border-primary">
            <div class="card-body">
              <h5 class="text-primary">🎟️ Total</h5>
              <p id="totalCount" class="fs-4 fw-bold">0</p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card shadow-sm border-success">
            <div class="card-body">
              <h5 class="text-success">✅ Utilisés</h5>
              <p id="usedCount" class="fs-4 fw-bold">0</p>
            </div>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card shadow-sm border-danger">
            <div class="card-body">
              <h5 class="text-danger">⏳ Non utilisés</h5>
              <p id="unusedCount" class="fs-4 fw-bold">0</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Barre de recherche + export -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <input
          type="text"
          class="form-control me-3"
          id="searchInput"
          placeholder="🔍 Rechercher un code..."
        />
        <a href="/admin/export-csv" class="btn btn-primary">📤 Exporter CSV</a>
      </div>

      <!-- Tableau des tickets -->
      <div class="table-responsive">
        <table class="table table-bordered align-middle text-center">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Code</th>
              <th>Statut</th>
              <th>QR Code</th>
              <th>Créé le</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="ticket-list"></tbody>
        </table>
      </div>
    </div>

    <!-- Scripts -->
    <script>
      // ✅ Redirection si le token n'existe pas
      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "/admin-login.html";
      }

      // ✅ Déconnexion
      function logout() {
        localStorage.removeItem("token");
        window.location.href = "/admin-login.html";
      }

      let ticketsData = [];

      function renderTable(tickets) {
        const ticketList = document.getElementById("ticket-list");
        ticketList.innerHTML = "";

        let used = 0,
          unused = 0;

        tickets.forEach((ticket) => {
          ticket.isUsed ? used++ : unused++;

          const row = document.createElement("tr");
          row.innerHTML = `
              <td>${ticket._id}</td>
              <td>${ticket.code}</td>
              <td id="status-${ticket._id}">${
            ticket.isUsed ? "✅ Utilisé" : "⏳ Non utilisé"
          }</td>
              <td><img src="${ticket.qrUrl}" width="80"></td>
              <td>${new Date(ticket.createdAt).toLocaleString()}</td>
              <td>
                <button class="btn btn-sm btn-success" ${
                  ticket.isUsed ? "disabled" : ""
                } onclick="confirmUse('${ticket._id}', '${
            ticket.code
          }')">Marquer</button>
              </td>
            `;
          ticketList.appendChild(row);
        });

        document.getElementById("totalCount").textContent = tickets.length;
        document.getElementById("usedCount").textContent = used;
        document.getElementById("unusedCount").textContent = unused;
      }

      // ✅ Envoi du token dans l'en-tête Authorization
      function confirmUse(id, code) {
        if (confirm(`Confirmer la validation du ticket : ${code} ?`)) {
          fetch(`/admin/tickets/${id}/use`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
            },
          })
            .then((res) => res.json())
            .then((ticket) => {
              alert(`✅ Ticket ${ticket.code} marqué comme utilisé.`);
              loadTickets();
            });
        }
      }

      function loadTickets() {
        fetch("/admin/tickets", {
          headers: {
            Authorization: `Bearer ${token}`, // ✅ Ajout du token ici
          },
        })
          .then((res) => {
            if (res.status === 401) {
              logout(); // ✅ Déconnexion automatique si le token est invalide
            }
            return res.json();
          })
          .then((data) => {
            ticketsData = data;
            renderTable(data);
          });
      }

      document
        .getElementById("searchInput")
        .addEventListener("input", function () {
          const keyword = this.value.toLowerCase();
          const filtered = ticketsData.filter((ticket) =>
            ticket.code.toLowerCase().includes(keyword)
          );
          renderTable(filtered);
        });

      loadTickets();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

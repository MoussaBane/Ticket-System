<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manager Dashboard</title>
  <link rel="icon" type="image/jpeg" href="/logo.jpg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-4">
    <h1>Manager - Reservations</h1>

    <div class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">Ajouter une réservation</h5>
        <form id="singleForm">
          <div class="row g-2">
            <div class="col-md-6"><input class="form-control" placeholder="Buyer Name" id="buyerName" required></div>
            <div class="col-md-6"><input class="form-control" placeholder="Buyer Email" id="buyerEmail" required></div>
            <div class="col-md-6"><input class="form-control" placeholder="Buyer Phone" id="buyerPhone"></div>
            <div class="col-md-6"><input class="form-control" placeholder="Holder Name" id="holderName" required></div>
            <div class="col-md-6"><input class="form-control" placeholder="Holder Email" id="holderEmail" required></div>
            <div class="col-12 text-end"><button class="btn btn-primary" type="submit">Create Reservation</button></div>
          </div>
        </form>
      </div>
    </div>

    <div class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">Importer CSV</h5>
        <p>Format: buyerName,buyerEmail,buyerPhone,holderName,holderEmail</p>
        <textarea id="csvData" class="form-control" rows="6" placeholder="Paste CSV content here"></textarea>
        <div class="text-end mt-2"><button id="importBtn" class="btn btn-secondary">Import CSV</button></div>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Mes réservations</h5>
        <table class="table table-striped" id="reservationsTable">
          <thead><tr><th>Holder</th><th>Holder Email</th><th>Status</th><th>Created At</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
const token = localStorage.getItem('token');
if(!token) window.location.href = '/admin-auth.html';

async function loadReservations(){
  const res = await fetch('/api/manager/reservations', { headers: { Authorization: `Bearer ${token}` } });
  if(res.status===401) return window.location.href='/admin-auth.html';
  const data = await res.json();
  const tbody = document.querySelector('#reservationsTable tbody');
  tbody.innerHTML = '';
  data.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.holderName}</td><td>${r.holderEmail}</td><td>${r.status}</td><td>${new Date(r.createdAt).toLocaleString()}</td>`;
    tbody.appendChild(tr);
  });
}

document.getElementById('singleForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const body = {
    buyerName: document.getElementById('buyerName').value,
    buyerEmail: document.getElementById('buyerEmail').value,
    buyerPhone: document.getElementById('buyerPhone').value,
    holderName: document.getElementById('holderName').value,
    holderEmail: document.getElementById('holderEmail').value
  };
  const res = await fetch('/api/manager/reservations', { method: 'POST', headers: { 'Content-Type':'application/json', Authorization: `Bearer ${token}` }, body: JSON.stringify(body) });
  if(res.ok){ loadReservations(); alert('Reservation created'); }
  else alert('Error creating reservation');
});

document.getElementById('importBtn').addEventListener('click', async ()=>{
  const csv = document.getElementById('csvData').value;
  if(!csv) return alert('CSV required');
  const res = await fetch('/api/manager/import-reservations', { method: 'POST', headers: { Authorization: `Bearer ${token}`, 'Content-Type':'text/plain' }, body: csv });
  if(res.ok){ const j = await res.json(); alert('Imported: '+j.count); loadReservations(); } else alert('Import failed');
});

loadReservations();
</script>
</body>
</html>

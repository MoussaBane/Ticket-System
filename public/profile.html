<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
  <style>
    body {
      background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
        url("/background.jpg") no-repeat center center fixed;
      background-size: cover;
      color: white;
      min-height: 100vh;
    }
    .card {
      background-color: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h1><i class="bi bi-person-circle"></i> Mon Profil</h1>
          <a href="/admin.html" class="btn btn-outline-light"><i class="bi bi-arrow-left"></i> Retour</a>
        </div>

        <div class="card mb-4">
          <div class="card-body">
            <h5 class="card-title">Informations du compte</h5>
            <form id="profileForm">
              <div class="mb-3">
                <label class="form-label">Nom</label>
                <input type="text" class="form-control" id="nom" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Prénom</label>
                <input type="text" class="form-control" id="prenom" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Rôle</label>
                <input type="text" class="form-control" id="role" disabled>
              </div>
              <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Mettre à jour le profil</button>
            </form>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Changer le mot de passe</h5>
            <form id="passwordForm">
              <div class="mb-3">
                <label class="form-label">Mot de passe actuel</label>
                <input type="password" class="form-control" id="currentPassword" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Nouveau mot de passe</label>
                <input type="password" class="form-control" id="newPassword" required minlength="8">
              </div>
              <div class="mb-3">
                <label class="form-label">Confirmer le nouveau mot de passe</label>
                <input type="password" class="form-control" id="confirmPassword" required minlength="8">
              </div>
              <button type="submit" class="btn btn-warning"><i class="bi bi-key"></i> Changer le mot de passe</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/admin-auth.html';

    async function loadProfile() {
      try {
        const res = await fetch('/api/users/me', {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.status === 401) return window.location.href = '/admin-auth.html';
        const data = await res.json();
        if (data.success && data.user) {
          document.getElementById('nom').value = data.user.nom || '';
          document.getElementById('prenom').value = data.user.prenom || '';
          document.getElementById('email').value = data.user.email || '';
          document.getElementById('role').value = data.user.role || '';
        }
      } catch (err) {
        console.error(err);
        alert('Erreur lors du chargement du profil');
      }
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        nom: document.getElementById('nom').value,
        prenom: document.getElementById('prenom').value,
        email: document.getElementById('email').value
      };
      try {
        const res = await fetch('/api/users/me', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
          alert('Profil mis à jour avec succès');
          loadProfile();
        } else {
          alert(data.message || 'Erreur');
        }
      } catch (err) {
        console.error(err);
        alert('Erreur lors de la mise à jour');
      }
    });

    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        alert('Les mots de passe ne correspondent pas');
        return;
      }

      try {
        const res = await fetch('/api/users/me', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ currentPassword, newPassword })
        });
        const data = await res.json();
        if (data.success) {
          alert('Mot de passe changé avec succès');
          document.getElementById('passwordForm').reset();
        } else {
          alert(data.message || 'Erreur');
        }
      } catch (err) {
        console.error(err);
        alert('Erreur lors du changement de mot de passe');
      }
    });

    // Fix: GET request for profile info
    async function getMe() {
      const res = await fetch('/api/users/me', {
        method: 'GET',
        headers: { Authorization: `Bearer ${token}` }
      });
      if (res.status === 401) return window.location.href = '/admin-auth.html';
      const data = await res.json();
      if (data.success && data.user) {
        document.getElementById('nom').value = data.user.nom || '';
        document.getElementById('prenom').value = data.user.prenom || '';
        document.getElementById('email').value = data.user.email || '';
        document.getElementById('role').value = data.user.role || '';
      }
    }

    getMe();
  </script>
</body>
</html>

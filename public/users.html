<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gestion des Utilisateurs</title>
  <link rel="icon" type="image/jpeg" href="/logo.jpg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
  <style>
    body {
      background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)),
        url("/background.png") no-repeat center center fixed;
      background-size: cover;
      color: white;
      min-height: 100vh;
    }
    .card {
      background-color: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .table {
      color: white;
    }
    .table thead th {
      background-color: #6f42c1;
    }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1><i class="bi bi-people"></i> Gestion des Utilisateurs</h1>
      <a href="/admin.html" class="btn btn-outline-light"><i class="bi bi-arrow-left"></i> Retour</a>
    </div>

    <div class="card">
      <div class="card-body">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>Nom</th>
              <th>Prénom</th>
              <th>Email</th>
              <th>Rôle</th>
              <th>Créé le</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Change Role -->
  <div class="modal fade" id="roleModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content bg-dark text-white">
        <div class="modal-header">
          <h5 class="modal-title">Changer le rôle</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>Utilisateur: <strong id="roleUserName"></strong></p>
          <div class="mb-3">
            <label class="form-label">Nouveau rôle</label>
            <select class="form-select" id="roleSelect">
              <option value="normal">Normal</option>
              <option value="manager">Manager</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="button" class="btn btn-primary" onclick="saveRole()">Enregistrer</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Reset Password -->
  <div class="modal fade" id="passwordModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content bg-dark text-white">
        <div class="modal-header">
          <h5 class="modal-title">Réinitialiser le mot de passe</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>Utilisateur: <strong id="passwordUserName"></strong></p>
          <div class="mb-3">
            <label class="form-label">Nouveau mot de passe</label>
            <input type="password" class="form-control" id="newPassword" minlength="8" required>
            <small class="text-muted">Minimum 8 caractères</small>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="button" class="btn btn-warning" onclick="resetPassword()">Réinitialiser</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/admin-auth.html';

    // Decode JWT to get user info
    function parseJwt(token) {
      try {
        return JSON.parse(atob(token.split('.')[1]));
      } catch (e) {
        return null;
      }
    }

    // Check if token is expired
    function isTokenExpired(token) {
      const payload = parseJwt(token);
      if (!payload || !payload.exp) return true;
      return Date.now() >= payload.exp * 1000;
    }

    // Check token expiration every minute
    setInterval(() => {
      if (isTokenExpired(token)) {
        localStorage.removeItem('token');
        alert('Votre session a expiré. Veuillez vous reconnecter.');
        window.location.href = '/admin-auth.html';
      }
    }, 60000);

    // Initial check on page load
    if (isTokenExpired(token)) {
      localStorage.removeItem('token');
      alert('Votre session a expiré. Veuillez vous reconnecter.');
      window.location.href = '/admin-auth.html';
    }

    let currentUserId = null;
    const roleModal = new bootstrap.Modal(document.getElementById('roleModal'));
    const passwordModal = new bootstrap.Modal(document.getElementById('passwordModal'));

    async function loadUsers() {
      try {
        const res = await fetch('/api/users', {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.status === 401 || res.status === 403) return window.location.href = '/admin-auth.html';
        const response = await res.json();
        const users = response.data || [];
        const tbody = document.getElementById('usersTable');
        tbody.innerHTML = '';
        users.forEach(user => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${user.nom}</td>
            <td>${user.prenom}</td>
            <td>${user.email}</td>
            <td><span class="badge bg-${user.role === 'admin' ? 'danger' : user.role === 'manager' ? 'warning' : 'secondary'}">${user.role}</span></td>
            <td>${new Date(user.createdAt).toLocaleDateString()}</td>
            <td>
              <button class="btn btn-sm btn-primary" onclick="showRoleModal('${user._id}', '${user.nom} ${user.prenom}', '${user.role}')">
                <i class="bi bi-shield"></i> Rôle
              </button>
              <button class="btn btn-sm btn-warning" onclick="showPasswordModal('${user._id}', '${user.nom} ${user.prenom}')">
                <i class="bi bi-key"></i> Mot de passe
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error(err);
        alert('Erreur lors du chargement des utilisateurs');
      }
    }

    function showRoleModal(userId, name, currentRole) {
      currentUserId = userId;
      document.getElementById('roleUserName').textContent = name;
      document.getElementById('roleSelect').value = currentRole;
      roleModal.show();
    }

    function showPasswordModal(userId, name) {
      currentUserId = userId;
      document.getElementById('passwordUserName').textContent = name;
      document.getElementById('newPassword').value = '';
      passwordModal.show();
    }

    async function saveRole() {
      const role = document.getElementById('roleSelect').value;
      try {
        const res = await fetch(`/api/users/${currentUserId}/role`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ role })
        });
        const data = await res.json();
        if (data.success) {
          alert('Rôle modifié avec succès');
          roleModal.hide();
          loadUsers();
        } else {
          alert(data.message || 'Erreur');
        }
      } catch (err) {
        console.error(err);
        alert('Erreur lors de la modification du rôle');
      }
    }

    async function resetPassword() {
      const newPassword = document.getElementById('newPassword').value;
      if (!newPassword || newPassword.length < 8) {
        alert('Le mot de passe doit contenir au moins 8 caractères');
        return;
      }
      try {
        const res = await fetch(`/api/users/${currentUserId}/reset-password`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ newPassword })
        });
        const data = await res.json();
        if (data.success) {
          alert('Mot de passe réinitialisé avec succès');
          passwordModal.hide();
        } else {
          alert(data.message || 'Erreur');
        }
      } catch (err) {
        console.error(err);
        alert('Erreur lors de la réinitialisation du mot de passe');
      }
    }

    loadUsers();
  </script>
</body>
</html>

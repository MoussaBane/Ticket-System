<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Connexion & Inscription</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-image: url("/background.jpg");
        background-size: cover;
        background-position: center center;
        color: rgb(0, 0, 0);
      }

      .card {
        background-color: rgba(255, 255, 255, 0.8);
        border-radius: 10px;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div id="loginForm" class="card p-4">
            <h3 class="text-center mb-3">Connexion Admin</h3>
            <div class="mb-3">
              <label for="loginEmail" class="form-label">Email</label>
              <input
                type="email"
                id="loginEmail"
                class="form-control"
                placeholder="admin@email.com"
                required
              />
            </div>
            <div class="mb-3">
              <label for="loginPassword" class="form-label">Mot de passe</label>
              <input
                type="password"
                id="loginPassword"
                class="form-control"
                required
              />
            </div>
            <button onclick="login()" class="btn btn-primary w-100">
              Se connecter
            </button>
            <div id="loginError" class="text-danger mt-3 text-center"></div>
            <div class="mt-3 text-center">
              <a href="#" onclick="toggleForms()">Pas encore inscrit ?</a>
            </div>
          </div>

          <div id="registerForm" class="card p-4 d-none">
            <h3 class="text-center mb-3">Inscription Admin</h3>
            <div class="mb-3">
              <label for="nom" class="form-label">Nom</label>
              <input type="text" id="nom" class="form-control" required />
            </div>
            <div class="mb-3">
              <label for="prenom" class="form-label">Prénom</label>
              <input type="text" id="prenom" class="form-control" required />
            </div>
            <div class="mb-3">
              <label for="registerEmail" class="form-label">Email</label>
              <input
                type="email"
                id="registerEmail"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <label for="registerPassword" class="form-label"
                >Mot de passe</label
              >
              <input
                type="password"
                id="registerPassword"
                class="form-control"
                required
              />
            </div>
            <button onclick="register()" class="btn btn-success w-100">
              S'inscrire
            </button>
            <div id="registerMsg" class="text-danger mt-3 text-center"></div>
            <div class="mt-3 text-center">
              <a href="#" onclick="toggleForms()">Déjà inscrit ?</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function toggleForms() {
        document.getElementById("loginForm").classList.toggle("d-none");
        document.getElementById("registerForm").classList.toggle("d-none");
      }

      function login() {
        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;
        const errorMsg = document.getElementById("loginError");

        // Validation basique
        if (!email || !password) {
          errorMsg.textContent = "Veuillez remplir tous les champs";
          return;
        }

        fetch("/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        })
          .then(async (res) => {
            const data = await res.json();
            if (!res.ok) {
              throw new Error(data.message || "Identifiants incorrects");
            }
            return data;
          })
          .then((data) => {
            localStorage.setItem("token", data.token);
            window.location.href = "/admin.html";
          })
          .catch((err) => {
            errorMsg.textContent = err.message;
          });
      }

      function register() {
        const nom = document.getElementById("nom").value;
        const prenom = document.getElementById("prenom").value;
        const email = document.getElementById("registerEmail").value;
        const password = document.getElementById("registerPassword").value;
        const msg = document.getElementById("registerMsg");

        fetch("/admin/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nom, prenom, email, password: password }),
        })
          .then(async (res) => {
            const data = await res.json();
            if (!res.ok) {
              throw new Error(data.message || "Inscription échouée");
            }
            return data;
          })
          .then(() => {
            msg.style.color = "green";
            msg.textContent = "✅ Inscription réussie. Connectez-vous.";
            toggleForms();
          })
          .catch((err) => {
            msg.style.color = "red";
            msg.textContent = err.message;
          });
      }
    </script>
  </body>
</html>

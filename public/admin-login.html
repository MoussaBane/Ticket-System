<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <title>Connexion Admin</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
            rel="stylesheet">
    </head>
    <body
        class="bg-light d-flex align-items-center justify-content-center vh-100">
        <div class="card p-4 shadow" style="min-width: 300px;">
            <h3 class="mb-3 text-center">Connexion Admin</h3>
            <input type="password" id="password" class="form-control mb-3"
                placeholder="Mot de passe">
            <button class="btn btn-primary w-100" onclick="login()">Se
                connecter</button>
            <p id="errorMsg" class="text-danger mt-2 text-center"
                style="display: none;">Mot de passe incorrect</p>
        </div>

        <script>
            function login() {
                const pwd = document.getElementById('password').value;
                const validPwd = "admin2025"; // change ce mot de passe comme tu veux
                if (pwd === validPwd) {
                    localStorage.setItem('isAdmin', 'true');
                    window.location.href = "/admin.html";
                } else {
                    document.getElementById('errorMsg').style.display = 'block';
                }
            }
        </script>
    </body>
</html>

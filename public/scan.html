<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Scan QR Code</title>
        <script src="https://unpkg.com/html5-qrcode"></script>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

        <style>
            body {
                background-image: url("/background.jpg");
                background-size: cover;
                background-position: center center;
                color: white;
            }
      
        </style>
            
    </head>
    <body class="container py-5">

        <h2 class="mb-4">📷 Scanner un billet</h2>

        <div id="reader" style="width: 300px;"></div>
        <div id="result" class="mt-4 fs-5 fw-bold"></div>

        <script>
            // La fonction onScanSuccess pour utiliser usedAt
            function onScanSuccess(decodedText, decodedResult) {
                fetch('/validate-ticket', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: decodedText })
                })
                .then(res => res.json())
                .then(data => {
                    const resultDiv = document.getElementById('result');
                    if (data.success) {
                    const date = new Date(data.usedAt).toLocaleString();
                    resultDiv.innerHTML = `
                        <span class="text-success">✅ ${data.message}</span><br>
                        <small>Validé le: ${date}</small>
                    `;
                    } else {
                    resultDiv.innerHTML = `<span class="text-danger">❌ ${data.message}</span>`;
                    }
                });
            }

            new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 })
            .render(onScanSuccess);
        </script>
    </body>
</html>
